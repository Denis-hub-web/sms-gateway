<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <circle cx="50" cy="50" r="50" fill="#000"/>
  <!-- Penguin body white -->
  <ellipse cx="50" cy="68" rx="17" ry="20" fill="#fff"/>
  <!-- Penguin head white -->
  <ellipse cx="50" cy="38" rx="15" ry="16" fill="#fff"/>
  <!-- Left wing black -->
  <ellipse cx="34" cy="58" rx="9" ry="16" fill="#000" transform="rotate(-10 34 58)"/>
  <!-- Right wing shadow -->
  <ellipse cx="63" cy="58" rx="7" ry="14" fill="#000" transform="rotate(8 63 58)"/>
  <!-- Body center divider (belly) -->
  <ellipse cx="50" cy="68" rx="10" ry="14" fill="#fff"/>
  <!-- Head -->
  <ellipse cx="50" cy="37" rx="12" ry="13" fill="#fff"/>
  <!-- Black cap -->
  <ellipse cx="50" cy="30" rx="12" ry="8" fill="#000"/>
  <!-- Beak -->
  <polygon points="59,40 66,43 59,46" fill="#000"/>
  <!-- Eye -->
  <circle cx="57" cy="38" r="2.5" fill="#000"/>
  <circle cx="56" cy="37" r="0.8" fill="#fff"/>
</svg>
