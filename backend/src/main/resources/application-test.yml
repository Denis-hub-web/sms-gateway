spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  flyway:
    enabled: false

app:
  jwt:
    secret: test-secret-key-minimum-256-bits-long-for-testing-purposes-only
    access-token-expiry-ms: 900000
    refresh-token-expiry-ms: 604800000
    gateway-token-expiry-ms: 31536000000
