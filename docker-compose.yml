version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: smsgateway_db
    environment:
      POSTGRES_DB: smsgateway
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smsgateway

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smsgateway_backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smsgateway
      DB_USER: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
      JWT_SECRET: "change-this-to-a-secure-minimum-256-bit-random-secret-in-production"
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - smsgateway

  dashboard:
    image: nginx:alpine
    container_name: smsgateway_dashboard
    volumes:
      - ./admin-dashboard:/usr/share/nginx/html:ro
    ports:
      - "3000:80"
    networks:
      - smsgateway

volumes:
  postgres_data:

networks:
  smsgateway:
    driver: bridge
